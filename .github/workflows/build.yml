name: Build check and announce

# The site is deployed by hand to a Cloudflare Worker (tools/deploy_cloudflare.sh),
# before the push. This checks that it still tests and builds, then announces
# the pushed posts, which are live by then.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Recovery for a post whose first push failed its build or announce (the
      # push that fixed it does not announce it): the commit before the post
      # was added. Empty: the manual run only builds.
      announce_since:
        description: "Announce posts added since this commit SHA (empty: build only)"
        required: false
        type: string
        default: ""

# Read-only: build and announce (which runs `npm ci` and then handles the
# social secrets) get no write scopes.
permissions:
  contents: read

# Queue runs instead of cancelling them: a cancelled run loses its announce
# job, and the next run only diffs its own before/after, so the post in the
# cancelled push would never be announced. `queue: max` keeps up to 100 runs
# pending (the default keeps one and cancels it when another arrives).
concurrency:
  group: announce
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test browser controls
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build Astro site
        run: npm run build

  # The post has to be live when Mastodon and Bluesky crawl the link for its
  # preview card, so deploy (tools/deploy_cloudflare.sh) before pushing. Runs
  # after the build check, so a broken build announces nothing.
  announce:
    needs: build
    runs-on: ubuntu-latest
    # A push announces its own before..after; a manual run on main only when
    # announce_since is set (scripts/lib/announce.ts announceRange checks it).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.announce_since != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Post to Mastodon
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          ANNOUNCE_SINCE: ${{ inputs.announce_since }}
        run: npm run post-mastodon

      # Runs even when the Mastodon step failed; each network is independent.
      - name: Post to Blue Sky
        if: ${{ !cancelled() }}
        env:
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          ANNOUNCE_SINCE: ${{ inputs.announce_since }}
        run: npm run post-bluesky
