name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default: build and announce (which runs `npm ci` and then
# handles the social secrets) get no write scopes. Only deploy can publish.
permissions:
  contents: read

# Queue runs instead of cancelling them: each push gets built, deployed and
# announced in order. (A cancelled or failed run's posts are still announced
# by the next successful run, which diffs from the last successful run's
# head; see the announce job.) `queue: max` keeps up to 100 runs pending (the
# default keeps one and cancels it when another arrives).
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test browser controls
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Announces after deploy so the new post is actually live when Mastodon and
  # Bluesky crawl the link for its preview card. Announcing from the build job
  # raced the deploy, and an announce failure used to fail the deploy itself.
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # actions: read lets `gh run list` see this workflow's earlier runs.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A push whose build or deploy failed was never announced, and the push
      # that fixed it only diffs its own before..after. So diff from the head
      # of the last successful run for a push to main instead; the scripts
      # skip what the accounts already announced. scripts/announce-base.ts
      # falls back to the event's before when the lookup fails, finds no run,
      # or that head is not an ancestor of this push (a force-push).
      - name: Choose the diff base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUNS_FILE="$RUNNER_TEMP/deploy-runs.json"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --event push \
            --status success --limit 50 --json headSha,databaseId,createdAt > "$RUNS_FILE" \
            || echo "⚠️ gh run list failed; falling back to the push's before." >&2
          RUNS_FILE="$RUNS_FILE" npx tsx scripts/announce-base.ts

      - name: Post to Mastodon
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          BEFORE_SHA: ${{ steps.base.outputs.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: npm run post-mastodon

      # Runs even when the Mastodon step failed; each network is independent.
      - name: Post to Blue Sky
        if: ${{ !cancelled() }}
        env:
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          BEFORE_SHA: ${{ steps.base.outputs.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: npm run post-bluesky
