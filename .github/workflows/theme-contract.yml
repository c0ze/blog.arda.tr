name: Theme contract

# Verifies that the blog's copies of the family's brand files (src/brand/:
# arda.css, brand.css, scheme.js) are the ones c0ze/arda.tr publishes in
# config/themes.json (contract v4, sha256 per file). While arda.tr's main
# still publishes an older contract the check prints a note and passes.
# Runs as its own workflow so a drift never fails the build check; the
# check itself soft-skips (exit 0) when the contract can't be fetched.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check theme contract
        run: node scripts/check-theme-contract.mjs
